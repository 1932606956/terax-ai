  <text x="200" y="72" font-size="13" font-weight="bold" fill="#eee">main.cpp</text>
  <text x="200" y="88" font-size="9" fill="#777">rapid-plugins/main.cpp · 预览</text>
  <rect x="474" y="58" width="22" height="22" rx="11" fill="#2a2a2a" stroke="#444"/>
  <text x="485" y="73" text-anchor="middle" font-size="11" fill="#aaa">📌</text>
