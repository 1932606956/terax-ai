  <text x="202" y="130" font-size="10" fill="#d7ba7d" font-family="Consolas, monospace">1  int main(int argc, char *argv[]) {</text>
  <text x="216" y="148" font-size="10" fill="#9cdcfe" font-family="Consolas, monospace">2    QApplication app(argc, argv);</text>
  <text x="216" y="166" font-size="10" fill="#4ec9b0" font-family="Consolas, monospace">3    MainWindow w;</text>
  <text x="216" y="184" font-size="10" fill="#dcdcaa" font-family="Consolas, monospace">4    w.show();</text>
  <text x="202" y="202" font-size="10" fill="#d7ba7d" font-family="Consolas, monospace">5    return app.exec();</text>
  <text x="202" y="220" font-size="10" fill="#d7ba7d" font-family="Consolas, monospace">6  }</text>
  <line x1="196" y1="470" x2="516" y2="470" stroke="#333"/>
  <text x="356" y="486" text-anchor="middle" font-size="9" fill="#777">单击预览 · 编辑变脏自动升级为正式标签页 · Esc 关闭</text>

