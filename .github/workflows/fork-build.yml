name: Fork Build (Windows)

# 私有 fork 构建线：只出 Windows 安装包，绕开 tauri-action 与 updater 签名
# （fork 无上游 secrets；createUpdaterArtifacts 关掉后无需 TAURI_SIGNING_PRIVATE_KEY）。
# 手动触发：gh workflow run fork-build.yml -R 1932606956/terax-ai --ref <branch>

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/default-model-and-compat-context

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (no updater artifacts)
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > fork-config.json
          pnpm tauri build --config fork-config.json

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: terax-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
